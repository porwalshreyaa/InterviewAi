<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heuristic</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="bg-gradient-to-br from-orange-500 via-pink-500 to-purple-600 font-serif font-thin">
  <div id="app">
    <!-- Navbar Component -->
    <nav class="bg-orange-500 text-white shadow-md fixed w-full z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center">
            <a href="#" class="hover:text-gray-700 text-xl font-extrabold">HEURISTIC</a>
          </div>

          <div class="hidden lg:flex space-x-4">
            <a v-for="item in navItems" :key="item.text"
               :href="item.href"
               class="hover:text-orange-200 font-extrabold px-2 py-2 text-md">
              {{ item.text }}
            </a>
          </div>

          <button
            class="bg-white/90 backdrop-blur-sm border border-white/20 px-6 py-2 text-md text-gray-700 font-extrabold rounded-lg hover:bg-orange-300 transition-all duration-300 shadow-lg hover:shadow-xl leading-relaxed">
            Sign Up/Guest In
          </button>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="text-white pt-24 pb-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
        <div>
          <h1 class="text-5xl md:text-6xl font-extrabold mb-6 leading-tight tracking-wide">
            Collaborate Seamlessly
          </h1>
          <p class="text-xl md:text-2xl mb-8 font-light leading-relaxed opacity-90">
            Write Anywhere. Sync Here. Work together in real-time with ease.
          </p>
          <button
            class="bg-white/10 backdrop-blur-sm border border-white/20 text-white px-8 py-4 text-lg font-semibold rounded-lg hover:bg-white/20 transition-all duration-300 shadow-lg hover:shadow-xl">
            Get Started
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8 lg:mt-0">
          <img v-for="(img, i) in heroImages"
               :key="i"
               :src="img"
               class="rounded-xl shadow-xl object-cover w-full"
               :class="i === 0 ? 'col-span-1 sm:col-span-2 h-64' : 'h-48'" />
        </div>
      </div>
    </section>

    <!-- Pricing Section -->
    <section id="pricing" class="text-white py-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-4xl md:text-5xl font-bold text-center mb-16 tracking-wide">Pricing</h2>
        <h4 class="text-xl md:text-2xl mb-8 font-light text-center leading-relaxed opacity-90">
          Get started on the Basic plan for free, no credit card required
        </h4>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">
          <div v-for="plan in plans" :key="plan.name"
               class="bg-white/95 backdrop-blur-sm text-orange-600 rounded-2xl shadow-xl p-8 flex flex-col items-center hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2">
            <img :src="plan.image" alt="plan.name" class="rounded-xl mb-6 w-full h-48 object-cover" />
            <h3 class="text-xl font-bold mb-2">{{ plan.name }}</h3>
            <h2 class="text-2xl text-gray-700 font-bold mb-3">{{ plan.price }}</h2>
            <ul class="mb-4">
              <li v-for="(feat, i) in plan.features" :key="i" class="text-gray-700 leading-relaxed">{{ feat }}</li>
            </ul>
            <button
              :disabled="plan.disabled"
              class="bg-orange-400 px-8 py-4 text-lg text-white font-semibold rounded-lg hover:bg-orange-300 transition-all duration-300 shadow-lg hover:shadow-xl leading-relaxed">
              {{ plan.disabled ? 'Use' : 'Buy' }}
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-white text-center py-8 bg-black/95">
      <p class="text-sm font-light tracking-wide">&copy; 2025 Heuristic. All rights reserved.</p>
    </footer>
  </div>

  <!-- Vue App -->
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          navItems: [
            { text: 'Documentation', href: '#' },
            { text: 'Pricing', href: '#' },
            { text: 'Blogs', href: '#' },
            { text: 'FAQ', href: '#' },
          ],
          heroImages: [
            'https://images.unsplash.com/photo-1694834931303-3208b7df2ecc?auto=format&w=1080',
            'https://images.unsplash.com/photo-1742827871480-4962b0653e1d?auto=format&w=1080',
            'https://images.unsplash.com/photo-1577549384746-d88d01e2c38c?auto=format&w=1080'
          ],
          plans: [
            {
              name: 'Basic',
              price: 'Free',
              image: 'https://images.unsplash.com/photo-1660901714052-ba6957feba6d?auto=format&w=1080',
              features: ['Feature 1', 'Feature 2', 'Feature 3', 'Feature 4'],
              disabled: true
            },
            {
              name: 'Pro',
              price: 'Rs 100/month',
              image: 'https://images.unsplash.com/photo-1566112718365-4c8ccbedc3d9?auto=format&w=1080',
              features: ['Feature 1', 'Feature 2', 'Feature 3', 'Feature 4'],
              disabled: false
            },
            {
              name: 'Ultra Pro',
              price: 'Rs 500/month',
              image: 'https://images.unsplash.com/photo-1684394213233-792d1ec08035?auto=format&w=1080',
              features: ['Feature 1', 'Feature 2', 'Feature 3', 'Feature 4'],
              disabled: false
            }
          ]
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
